plugins {
    id 'java'
}

group = 'my.xtream'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20260814'
}

tasks.register('copyToLib', Copy) {
    into layout.buildDirectory.dir("libs")
    from configurations.runtimeClasspath
}

tasks.named('build') {
    finalizedBy 'copyToLib'
}
